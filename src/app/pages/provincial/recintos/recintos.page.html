<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/provincial" text="Volver"></ion-back-button></ion-buttons>
    <ion-title>Recintos</ion-title>
    <ion-buttons slot="end"><ion-button routerLink="/provincial/recintos/nuevo">Nuevo</ion-button></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-estado-vista [estado]="recintos()" textoVacio="Aún no hay recintos." (reintentar)="ionViewWillEnter()" />
  <ion-list>
    @for (r of recintos().datos; track r.id) {
    <ion-item>
      <ion-label class="ion-text-wrap">
        <h2>{{ r.nombre }}</h2>
        <p>{{ r.canton }} · {{ r.parroquia }} · {{ r.mesas }} JRV</p>
        <p>Coordinador: {{ r.coordinador ?? 'sin asignar' }}</p>
      </ion-label>
      @if (!r.coordinador) {
      <ion-button slot="end" fill="outline" [routerLink]="['/provincial/recintos', r.id, 'coordinador']">
        Asignar
      </ion-button>
      }
    </ion-item>
    }
  </ion-list>
</ion-content>
